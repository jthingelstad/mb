name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.14"
          enable-cache: true
          prune-cache: true
      - run: uv sync --locked
      - name: Base CLI stays independent of MCP
        run: uv run --locked python -c "from mb.cli import app; import sys; assert 'mcp.server' not in sys.modules"
      - run: uv sync --locked --extra mcp
      - name: Lint
        run: uv run --locked --extra mcp ruff check .
      - name: Format
        run: uv run --locked --extra mcp ruff format --check .
      - name: Type check
        run: uv run --locked --extra mcp mypy src/mb --ignore-missing-imports
      - name: Audit locked dependencies
        run: |
          uv export --locked --extra mcp --no-dev --no-emit-project --format requirements-txt > /tmp/requirements.txt
          uvx --from pip-audit==2.10.1 pip-audit --requirement /tmp/requirements.txt --disable-pip
      - name: Tests
        run: uv run --locked --extra mcp pytest tests/ -q --cov=mb --cov-report=term-missing --cov-fail-under=70

      - name: Distribution contents
        run: |
          uv build
          uv run --locked --extra mcp python scripts/verify_distribution.py

      - name: Isolated base wheel smoke
        run: |
          uv venv /tmp/mb-base-wheel
          uv pip install --python /tmp/mb-base-wheel/bin/python --constraint /tmp/requirements.txt dist/*.whl
          /tmp/mb-base-wheel/bin/python scripts/base_wheel_smoke.py
