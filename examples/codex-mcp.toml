# Codex MCP server entry for mb. Add to ~/.codex/config.toml and adjust.
# Run `mb auth` first; never put a token in this file.
# Homebrew on Linux: /home/linuxbrew/.linuxbrew/bin/mb. Other installs: the path `command -v mb` prints.
[mcp_servers.mb]
command = "/opt/homebrew/bin/mb"
args = ["mcp", "--consumer", "codex", "--read-only"]
startup_timeout_sec = 20
tool_timeout_sec = 120
default_tools_approval_mode = "prompt"
# Optional: pick a profile/blog or enable image tools with global options before "mcp", e.g.
# args = ["--profile", "default", "--media-root", "/Users/you/mb-images", "mcp", "--consumer", "codex"]
# Remove "--read-only" only when you intend to allow writes.
